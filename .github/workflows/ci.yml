name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Foundry + Slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format
        working-directory: contracts
        run: forge fmt --check
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test
        working-directory: contracts
        run: forge test -vv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Slither
        working-directory: contracts
        run: |
          pip install slither-analyzer==0.11.6
          slither .

  apps:
    name: Apps (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rwa/contracts build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @rwa/api test
      - run: pnpm --filter @rwa/web test
      - run: pnpm --filter @rwa/api build
      - run: pnpm --filter @rwa/web build
